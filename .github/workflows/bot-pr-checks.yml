# SPDX-License-Identifier: MIT
#
# Baseline-diff CI for the Bot contract surface.
#
# Why this shape:
#   * PR #187 had no CI at all, and the review could not see a single check
#     run. A plain "run the gate" job is not enough here: several stages are
#     already red on the PR base itself (phone-hygiene, phone-modules,
#     phone-gate-contracts, the android :bot suite, the strings anchors). A
#     green-looking job that skips them would hide exactly the regressions the
#     review was about.
#   * Each job therefore collects STRUCTURED results on the same runner for a
#     fixed base commit and for the candidate head, and fails only when the
#     head has a failure the base did not have (same test id, same stage name,
#     same anchor id). Pre-existing failures are reported and uploaded, never
#     hidden. No test is removed, no fixture is skipped, no allowlist is used.
#   * No hard-coded failure counts live in this file. The counts are produced
#     by the run and written to the JSON receipts and the job summary.
#
# How to run it (root's pre-release step, never a worker push to the PR):
#   create/push a limited validation branch from the fixed candidate, e.g.
#       git push origin <candidate-sha>:refs/heads/ci/validation-<tag>
#   This workflow exists on that branch, which is what push events require.
#   `workflow_dispatch` is also listed, but GitHub only offers it once the
#   workflow exists on the default branch; do not treat dispatch as available
#   before that.
#
# Base commit: set the repository variable PR_BASE_SHA (Settings → Variables)
# to the fixed PR merge-base. When unset, the job falls back to
# `git merge-base origin/<default-branch> HEAD` and fails if that is empty.
#
# No real-model credentials are used here. The gating work is offline: Python
# spec/stage checks, the JVM `:bot` suite, and the strings anchor report.
name: bot-baseline-diff

on:
  push:
    branches:
      - "ci/validation/**"
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Fixed base commit to compare against (defaults to vars.PR_BASE_SHA or merge-base)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bot-baseline-diff-${{ github.ref }}
  cancel-in-progress: true

env:
  # Read once here so every job uses the same fixed base.
  CI_BASE_SHA: ${{ github.event.inputs.base_sha || vars.PR_BASE_SHA }}
  CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  # Guard the comparison tools themselves: the negative cases (new sub-check
  # in a red stage, coverage drop, removed anchor without evidence, short JUnit
  # run) must fail. This job is cheap and runs before the heavy ones.
  ci-tools-selftest:
    name: baseline-diff tool self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Negative-case tests for the comparison tools
        run: python3 scripts/ci/test_ci_tools.py

  # Python-only contract stages. Each stage is executed on base and head with
  # its own log; comparison is per stage name in scripts/ci/ci_baseline_diff.py.
  stage-baseline-diff:
    name: spec / stage baseline diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve fixed base
        id: base
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
          BASE="${CI_BASE_SHA}"
          if [ -z "${BASE}" ]; then
            BASE="$(git merge-base "origin/${CI_DEFAULT_BRANCH}" HEAD)"
          fi
          if [ -z "${BASE}" ]; then
            echo "::error::no base commit: set vars.PR_BASE_SHA or provide a merge-base"
            exit 1
          fi
          git cat-file -e "${BASE}^{commit}"
          echo "base=${BASE}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          git worktree add --detach /tmp/ci-base "${BASE}"
      - name: Collect stage results on base and head
        id: collect
        run: |
          set -uo pipefail
          mkdir -p artifacts/stages
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          HEAD = Path(".").resolve()
          BASE = Path("/tmp/ci-base")
          STAGES = [
              "phone-spec",
              "phone-gate-contracts",
              "phone-hygiene",
              "phone-license",
              "phone-modules",
              "phone-android-structure",
              "phone-bot-eval-catalog",
          ]
          out = {"stages": {}}
          for root_name, root in (("base", BASE), ("head", HEAD)):
              for stage in STAGES:
                  log = HEAD / "artifacts" / "stages" / f"{root_name}-{stage}.log"
                  with open(log, "w", encoding="utf-8") as handle:
                      proc = subprocess.run(
                          ["bash", "scripts/ci/check.sh", "--only", stage],
                          cwd=root, stdout=handle, stderr=subprocess.STDOUT,
                          text=True)
                  # The stage exit code alone is not evidence: a stage that is
                  # red at base can hide a second, new failing sub-check. Parse
                  # the log into an inventory (failures, checks, coverage) and
                  # let the comparator require it; an unparsable log becomes
                  # INCOMPLETE, never "no new failure".
                  inventory_path = log.with_suffix(".inventory.json")
                  inv = subprocess.run(
                      [sys.executable, str(HEAD / "scripts/ci/stage_inventory.py"),
                       str(log), "--json", str(inventory_path)],
                      cwd=HEAD, text=True, capture_output=True)
                  inventory = None
                  if inv.returncode == 0 and inventory_path.exists():
                      inventory = json.loads(inventory_path.read_text())
                  key = f"{root_name}/{stage}"
                  out["stages"][key] = {"rc": proc.returncode, "log": str(log),
                                        "inventory": inventory}
          # The comparator works per side; write one JSON per side.
          for side in ("base", "head"):
              side_out = {"stages": {k.split("/", 1)[1]: v
                                     for k, v in out["stages"].items()
                                     if k.startswith(side + "/")}}
              (HEAD / "artifacts" / "stages" / f"{side}.json").write_text(
                  json.dumps(side_out, ensure_ascii=False, indent=2) + "\n")
          print("stage results written")
          PY
      - name: Compare base and head stages (new failure = job failure)
        run: |
          set -euo pipefail
          python3 scripts/ci/ci_baseline_diff.py stages \
            --base artifacts/stages/base.json \
            --head artifacts/stages/head.json \
            --json artifacts/stages/diff.json
      - name: Stage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          diff_path = Path("artifacts/stages/diff.json")
          print("## stage baseline diff\n")
          if not diff_path.exists():
              print("comparison did not run")
              raise SystemExit
          d = json.loads(diff_path.read_text())
          print(f"- new failures: {len(d['new'])}")
          print(f"- pre-existing failures: {len(d['pre_existing'])}")
          print(f"- fixed: {len(d['fixed'])}")
          print(f"- incomplete: {len(d.get('incomplete', []))}")
          for name in d["new"]:
              print(f"- NEW `{name}`")
          for name in d.get("incomplete", []):
              print(f"- INCOMPLETE {name}")
          for name in d["pre_existing"]:
              print(f"- pre-existing `{name}`")
          PY
      - name: Upload stage logs and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-baseline-diff
          path: artifacts/stages/
          if-no-files-found: warn

  # JVM `:bot` suite on base and head; identity is JUnit classname#name.
  android-bot-diff:
    name: android :bot JUnit baseline diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve fixed base
        id: base
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
          BASE="${CI_BASE_SHA}"
          if [ -z "${BASE}" ]; then
            BASE="$(git merge-base "origin/${CI_DEFAULT_BRANCH}" HEAD)"
          fi
          [ -n "${BASE}" ] || { echo "::error::no base commit"; exit 1; }
          git cat-file -e "${BASE}^{commit}"
          echo "base=${BASE}"
          git worktree add --detach /tmp/ci-base "${BASE}"
      - name: Run :bot:test on base and head
        run: |
          set -uo pipefail
          mkdir -p artifacts/android
          for side in base head; do
            root="/tmp/ci-base"
            [ "${side}" = "head" ] && root="$PWD"
            # `|| true`: the suite is allowed to be red; the JSON/JUnit diff,
            # not this exit code, decides whether a failure is new.
            ( cd "${root}/android" && ./gradlew :bot:test --console=plain --max-workers=4 ) \
              > "artifacts/android/${side}.log" 2>&1 || true
          done
          cp -R android/bot/build/test-results/test artifacts/android/head-junit
          cp -R /tmp/ci-base/android/bot/build/test-results/test artifacts/android/base-junit
      - name: Compare JUnit failures (new failure = job failure)
        run: |
          set -euo pipefail
          python3 scripts/ci/ci_baseline_diff.py junit \
            --base artifacts/android/base-junit \
            --head artifacts/android/head-junit \
            --json artifacts/android/diff.json
      - name: Android summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("artifacts/android/diff.json")
          print("## android :bot baseline diff\n")
          if not p.exists():
              print("comparison did not run")
              raise SystemExit
          d = json.loads(p.read_text())
          print(f"- new failures: {len(d['new'])}")
          print(f"- pre-existing failures: {len(d['pre_existing'])}")
          print(f"- fixed: {len(d['fixed'])}")
          print(f"- incomplete: {len(d.get('incomplete', []))}")
          for n in d["new"]:
              print(f"- NEW `{n}`")
          for n in d.get("incomplete", []):
              print(f"- INCOMPLETE {n}")
          for n in d["pre_existing"]:
              print(f"- pre-existing `{n}`")
          PY
      - name: Upload JUnit and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-bot-diff
          path: artifacts/android/
          if-no-files-found: warn

  # Strings anchor report on base and head. The report helper imports the
  # authority checker's anchor rule, so repo-relative sources are resolved
  # from the repository root (the earlier ad-hoc audit resolved them against
  # the probe directory and counted 15 false failures).
  ui-anchor-diff:
    name: strings anchor baseline diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve fixed base
        id: base
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
          BASE="${CI_BASE_SHA}"
          if [ -z "${BASE}" ]; then
            BASE="$(git merge-base "origin/${CI_DEFAULT_BRANCH}" HEAD)"
          fi
          [ -n "${BASE}" ] || { echo "::error::no base commit"; exit 1; }
          git cat-file -e "${BASE}^{commit}"
          echo "base=${BASE}"
          git worktree add --detach /tmp/ci-base "${BASE}"
      - name: Report anchors on base and head
        run: |
          set -euo pipefail
          mkdir -p artifacts/anchors
          python3 scripts/ci/bot_ui_anchor_report.py /tmp/ci-base \
            --json artifacts/anchors/base.json
          python3 scripts/ci/bot_ui_anchor_report.py . \
            --json artifacts/anchors/head.json
      - name: Compare anchor failures (new failure = job failure)
        run: |
          set -euo pipefail
          python3 scripts/ci/ci_baseline_diff.py anchors \
            --base artifacts/anchors/base.json \
            --head artifacts/anchors/head.json \
            --allow-removals scripts/ci/anchor-removals.json \
            --json artifacts/anchors/diff.json
      - name: Anchor summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("artifacts/anchors/diff.json")
          print("## strings anchor baseline diff\n")
          if not p.exists():
              print("comparison did not run")
              raise SystemExit
          d = json.loads(p.read_text())
          print(f"- new failures: {len(d['new'])}")
          print(f"- pre-existing failures: {len(d['pre_existing'])}")
          print(f"- fixed: {len(d['fixed'])}")
          print(f"- incomplete: {len(d.get('incomplete', []))}")
          for n in d["new"]:
              print(f"- NEW `{n}`")
          for n in d.get("incomplete", []):
              print(f"- INCOMPLETE {n}")
          for n in d["pre_existing"]:
              print(f"- pre-existing `{n}`")
          PY
      - name: Upload anchor reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strings-anchor-diff
          path: artifacts/anchors/
          if-no-files-found: warn
