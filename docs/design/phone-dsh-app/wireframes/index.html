<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PhoneDSH · 黑白结构原型</title>
  <style>
    :root{--bg:#f6f6f6;--panel:#fff;--ink:#171717;--muted:#686868;--faint:#969696;--line:#d7d7d7;--soft:#ebebeb;--soft2:#f0f0f0;--black:#171717}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#dedede}
    body{display:flex;justify-content:center;align-items:center;min-height:100vh}
    button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}a{color:inherit}
    .phone{position:relative;width:390px;height:844px;max-width:100vw;max-height:100vh;max-height:100dvh;background:var(--bg);border:1px solid #bcbcbc;overflow:hidden}
    .statusbar{height:26px;padding:6px 18px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:600}
    .mockbar{height:36px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
    .mockbar button{border:0;background:none;min-height:32px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
    .page{height:calc(100% - 62px);overflow-y:auto;padding:14px 16px 120px;scrollbar-width:thin}.page.no-dock{padding-bottom:36px}
    h1{font-size:34px;line-height:1.15;margin:8px 0 12px;letter-spacing:-.5px}h2{font-size:22px;line-height:1.25;margin:20px 0 10px}h3{font-size:16px;line-height:1.35;margin:0 0 8px}p{font-size:15px;line-height:1.55;margin:0 0 12px}
    .small{font-size:12px;line-height:1.45;color:var(--muted)}.micro{font-size:11px;line-height:1.4;color:var(--muted)}.strong{font-weight:650}.muted{color:var(--muted)}.right{text-align:right}.center{text-align:center}.nowrap{white-space:nowrap}.break{overflow-wrap:anywhere}
    .row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.top{align-items:flex-start}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.stack{display:grid;gap:12px}.section{margin-top:22px}.divider{height:1px;background:var(--line);margin:14px 0}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.card.flat{background:var(--soft2)}.card.selected{outline:2px solid var(--ink);outline-offset:-2px}.clickable{cursor:pointer}.clickable:focus-visible,.btn:focus-visible,.dock button:focus-visible,.tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    .btn{min-height:44px;border:1px solid var(--ink);border-radius:12px;padding:10px 14px;background:var(--panel);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}.btn.primary{background:var(--black);color:#fff}.btn.ghost{border-color:var(--line);font-weight:500}.btn.danger{border-style:dashed}.btn.full{width:100%}.btn.smallbtn{min-height:36px;padding:6px 10px;font-size:12px;border-radius:10px}.btn svg{width:18px;height:18px}
    .icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}.iconbox{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;background:var(--panel);flex:none}
    .badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;line-height:1.2;color:var(--muted);background:var(--panel);white-space:nowrap}.badge.solid{background:var(--ink);color:#fff;border-color:var(--ink)}.badge.dashed{border-style:dashed}
    .dot{width:8px;height:8px;border:1px solid var(--ink);border-radius:50%;display:inline-block;flex:none}.dot.fill{background:var(--ink)}.dot.hollow{background:#fff}.statusline{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
    .header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.header .title{font-size:30px;font-weight:700;letter-spacing:-.4px}.back{border:0;background:none;padding:8px 0;min-height:40px;color:var(--ink);font-size:14px;text-decoration:underline;text-underline-offset:3px}
    .message{padding:12px 14px;border-radius:16px;margin-bottom:12px;font-size:15px;line-height:1.55}.message.user{background:#e5e5e5;margin-left:46px}.message.agent{background:transparent;padding-left:0;padding-right:0}.process{border-left:2px solid var(--ink);padding-left:12px;margin:10px 0 14px}.step{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;margin:9px 0}.stepnum{width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none}.step.pending{color:var(--faint)}.step.pending .stepnum{border-color:var(--line)}
    .progress{height:6px;background:#e2e2e2;border-radius:99px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--ink)}
    .asr{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 2px;margin:10px 0;font-size:12px;color:var(--muted);cursor:pointer}.asr .cursor{width:6px;height:14px;background:var(--ink);flex:none}
    .composer{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--ink);border-radius:18px;padding:8px;background:var(--panel);margin-top:10px}.composer textarea{border:0;resize:none;outline:0;background:transparent;flex:1;min-height:38px;max-height:96px;padding:9px 4px;font-size:14px;line-height:1.35}.composer .send{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;border:0;display:grid;place-items:center;flex:none}.composer .plus{width:36px;height:40px;border:0;background:none;font-size:24px;font-weight:300}
    .chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px}.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 10px;font-size:12px;white-space:nowrap;min-height:34px}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .dock{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:8px;align-items:flex-end;z-index:10}.dock-chat{flex:none;width:62px;height:62px;border-radius:50%;background:var(--panel);border:1px solid var(--ink);display:grid;place-items:center;color:var(--ink)}.dock-chat.active{background:var(--ink);color:#fff}.dock-rest{height:62px;flex:1;display:grid;background:var(--panel);border:1px solid var(--ink);border-radius:32px;overflow:hidden}.dock-item{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;padding:4px 1px;position:relative}.dock-item.active{color:var(--ink);font-weight:700;background:#e8e8e8}.dock-item .icon{width:19px;height:19px}.dock-badge{position:absolute;top:6px;right:13px;border:1px solid var(--ink);background:var(--panel);border-radius:8px;padding:0 3px;font-size:9px;line-height:12px}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{min-height:88px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:10px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:11px;color:var(--ink)}.tile .icon{width:24px;height:24px}
    .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}.ringwrap{text-align:center}.ring{--p:0deg;width:82px;height:82px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:conic-gradient(var(--ink) 0deg var(--p),#e3e3e3 var(--p) 360deg);position:relative}.ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}.ringvalue{position:relative;font-size:23px;font-weight:650}.ringlabel{font-size:11px;color:var(--muted)}
    .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}.tab{border:0;background:none;padding:10px 8px;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:650}
    .input,.select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:11px 12px;color:var(--ink);outline:none}.input:focus,.select:focus{border-color:var(--ink)}.inputrow{display:flex;gap:8px}.inputrow .input{flex:1}
    .list{padding:0;margin:0;list-style:none}.list li{padding:12px 0;border-bottom:1px solid var(--line)}.list li:last-child{border-bottom:0}
    .toast{position:absolute;left:22px;right:22px;bottom:86px;z-index:30;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:13px;padding:11px 13px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.toast button{border:0;background:none;color:#fff;text-decoration:underline;min-height:28px}
    .backdrop{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.28);display:flex;align-items:flex-end}.sheet{width:100%;max-height:74%;overflow-y:auto;background:var(--panel);border:1px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px 24px}.sheet h2{margin-top:0}.sheetclose{float:right;border:0;background:none;font-size:20px;min-width:36px;min-height:36px}
    .timeline{border-left:1px solid var(--ink);margin-left:7px;padding-left:17px}.timeline .card{position:relative}.timeline .card:before{content:"";position:absolute;left:-22px;top:20px;width:7px;height:7px;border:1px solid var(--ink);border-radius:50%;background:#fff}
    .speaker{border-left:3px solid var(--ink);padding-left:10px;margin-bottom:14px}.speaker .time{font-size:11px;color:var(--muted)}
    .audio-dock{position:absolute;left:0;right:0;bottom:82px;z-index:9;padding:8px 16px 10px;background:var(--bg);border-top:1px solid var(--line)}
    .empty{border:1px dashed var(--faint);border-radius:16px;padding:26px 18px;text-align:center;margin:20px 0}.empty h3{margin-bottom:8px}.empty p{color:var(--muted);font-size:13px}
    .notice{border:1px dashed var(--faint);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.45;color:var(--muted);margin-bottom:12px}.notice strong{color:var(--ink)}
    .mocktag{font-size:10px;border:1px solid var(--faint);padding:2px 5px;border-radius:5px;color:var(--muted);vertical-align:middle}
    .setup-hero{padding-top:34px}.setup-hero .mark{width:52px;height:52px;border:2px solid var(--ink);border-radius:15px;display:grid;place-items:center;font-size:19px;font-weight:800;margin-bottom:20px}.setup-hero h1{font-size:30px}.setup-hero p{font-size:16px;line-height:1.6}
    @media(max-width:390px){.phone{border:0}.page{padding-left:14px;padding-right:14px}.dock{left:10px;right:10px}.dock-chat{width:58px;height:58px}.dock-rest{height:58px}.ring{width:74px;height:74px}}
    @media(min-width:700px){.phone{border-radius:28px;box-shadow:0 0 0 1px #c4c4c4}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const icons = {
  chat:'<path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 9 9 0 0 1-4-.9L3 20l1.7-4.4A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5Z"/>',
  memory:'<path d="M9 4.5A3.5 3.5 0 0 0 5.5 8c0 .6.2 1.2.5 1.7A4.4 4.4 0 0 0 4 13.3c0 1.2.5 2.3 1.4 3.1A4.6 4.6 0 0 0 9 20.5c1.2 0 2.3-.5 3-1.3V4.5Z"/><path d="M15 4.5A3.5 3.5 0 0 1 18.5 8c0 .6-.2 1.2-.5 1.7a4.4 4.4 0 0 1 2 3.6c0 1.2-.5 2.3-1.4 3.1A4.6 4.6 0 0 1 15 20.5c-1.2 0-2.3-.5-3-1.3V4.5Z"/><path d="M8 10h4M12 14h4M15 8h3"/>',
  task:'<path d="M9 5h6M9 5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H9Z"/><path d="M9 5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2M8 11l2 2 4-4M8 18l2 2 4-4"/>',
  grid:'<rect x="4" y="4" width="5" height="5" rx="1"/><rect x="15" y="4" width="5" height="5" rx="1"/><rect x="4" y="15" width="5" height="5" rx="1"/><rect x="15" y="15" width="5" height="5" rx="1"/>',
  device:'<rect x="5" y="7" width="14" height="12" rx="3"/><path d="M9 7V4h6v3M9 19v2M15 19v2M9 12h.01M15 12h.01M12 15h.01"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7a6 6 0 0 0-.7-1.7l.9-1.9-2.1-2.1-1.9.9a6 6 0 0 0-1.7-.7L10.5 2h-3l-.7 2a6 6 0 0 0-1.7.7L3.2 3.8 1.1 5.9 2 7.8a6 6 0 0 0-.7 1.7L-1 10v3l2 .7a6 6 0 0 0 .7 1.7l-.9 1.9 2.1 2.1 1.9-.9a6 6 0 0 0 1.7.7l.7 2h3l.7-2a6 6 0 0 0 1.7-.7l1.9.9 2.1-2.1-.9-1.9a6 6 0 0 0 .7-1.7Z" transform="translate(2 0) scale(.85)"/>',
  file:'<path d="M6 2h8l4 4v16H6Z"/><path d="M14 2v5h5M9 12h6M9 16h6"/>',
  send:'<path d="m3 3 18 9-18 9 4-9Z"/><path d="M7 12h14"/>',
  search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
  plus:'<path d="M12 4v16M4 12h16"/>',
  mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>',
  back:'<path d="m14 5-7 7 7 7M7 12h14"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',
  link:'<path d="M10 14a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1-1"/>',
  check:'<path d="m5 12 4 4L19 6"/>',
  x:'<path d="m6 6 12 12M18 6 6 18"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  home:'<path d="m3 11 9-8 9 8M5 10v11h14V10M9 21v-7h6v7"/>',
  computer:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/><path d="m9 12 2 2 4-4"/>',
  wallet:'<path d="M4 6h14a2 2 0 0 1 2 2v11H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12v3"/><path d="M16 12h6v5h-6a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2Z"/>',
  phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',
  play:'<path d="m8 5 11 7-11 7Z"/>',
  edit:'<path d="m4 16-1 5 5-1L19 9l-4-4Z"/><path d="m13 7 4 4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  pin:'<path d="m9 4 6 0 1 5 3 3-4 2-3 7-3-7-4-2 3-3Z"/>',
  sidebar:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M13 9h4M13 13h4"/>',
  more:'<path d="M5 12h.01M12 12h.01M19 12h.01"/>'
};
function icon(name, cls='icon'){return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.info}</svg>`}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clone(value){return JSON.parse(JSON.stringify(value))}
const seed = {
  tasks:[
    {id:'hardware-plan',title:'硬件接入评审纪要与待办',status:'running',step:2,total:3,progress:66,source:'今天 10:00–10:42 · 硬件接入评审',cost:'用量待同步',artifact:null},
    {id:'send-feishu',title:'发送评审摘要到飞书',status:'waitingApproval',step:1,total:2,progress:50,source:'由硬件接入评审纪要触发',cost:'预估 36 Credits',artifact:null},
    {id:'daily-recap',title:'今日 AI日记整理',status:'completed',step:3,total:3,progress:100,source:'今日录音与 Agent 工作',cost:'实际用量待同步',artifact:'今日 AI日记'}
  ],
  memories:[
    {id:'local-first',text:'重要原始资料优先保存在手机本地，云模型只接收当次必要片段',type:'约束',status:'candidate',version:1,source:'今天 10:18 · 硬件接入评审'},
    {id:'short-answer',text:'语音回答保持简短，详细内容放到手机里查看',type:'偏好',status:'candidate',version:1,source:'今天 11:06 · 你亲口所说'},
    {id:'ble-priority',text:'优先验证自有 link 设备的 BLE 接入与录音补传',type:'工作进展',status:'active',version:2,source:'昨天 16:40 · 你确认过'}
  ]
};
const state = {
  agentConfigured:false,agentName:'小P',ownerName:'Leo',provider:'byok',providerConfigured:false,engine:'ready',dshStarted:false,
  device:{name:'小智 Link',online:true,revision:3,capabilities:['麦克风','唤醒','LED 控制']},recording:true,
  tasks:clone(seed.tasks),memories:clone(seed.memories),diary:true,scenario:'未配置',sheet:null,toast:null,undo:null,
  taskFilter:'all',memoryTab:'pending',memoryQuery:'',minuteTab:'summary',highlightEvidence:false,
  audioPlaying:false,audioPosition:618,audioRate:1,
  draft:'',userPrompt:'把今天的硬件接入评审整理成纪要，提取待办并保存到本地',receipt:null,pairStage:'scan',pairSelected:false
};
function toast(text,undo=null){state.toast=text;state.undo=undo;render();const current=text;setTimeout(()=>{if(state.toast===current){state.toast=null;state.undo=null;render()}},5000)}
function go(route){state.sheet=null;if(location.hash==='#'+route){render()}else{location.hash=route}}
function route(){return (location.hash||'#dsh').slice(1)}
function engineLabel(){return state.engine==='ready'?'本地运行':state.engine==='starting'?'正在准备本地引擎':state.engine==='parked'?'后台已暂停':'引擎需要处理'}
function deviceReady(){return state.device&&state.device.online}
function engineHeader(){
  const deviceText=state.device?`${state.device.name} · ${state.device.online?'已连接':'离线'}`:'未连接设备';
  return `<div class="card flat" style="padding:11px 12px"><div class="row between"><button class="back" data-go="settings" style="text-decoration:none"><span class="statusline"><span class="dot ${state.engine==='ready'?'fill':'hollow'}"></span>${engineLabel()}</span></button><button class="back" data-go="devices" style="text-decoration:none;font-size:12px">${deviceText} ›</button></div></div>`
}
function pageTitle(title,action=''){return `<div class="header"><div class="title">${title}</div><div>${action}</div></div>`}
function back(label,path){return `<button class="back" data-go="${path}">‹ ${label}</button>`}
function dock(active){
  const pending=state.tasks.filter(t=>t.status==='waitingApproval').length;
  const items=state.agentConfigured?[['recap','AI日记','book'],['dsh','DSH','task'],['discover','发现','grid'],['personal','个人','user']]:[['dsh','DSH','task'],['discover','发现','grid'],['personal','个人','user']];
  return `<nav class="dock" aria-label="主导航"><button class="dock-chat ${active==='chat'?'active':''}" data-go="chat" aria-label="Personal Agent Chat">${icon('chat')}</button><div class="dock-rest" style="grid-template-columns:repeat(${items.length},1fr)">${items.map(([id,label,ico])=>`<button class="dock-item ${active===id?'active':''}" data-go="${id}" aria-label="${label}">${icon(ico)}<span>${label}</span>${id==='dsh'&&pending?`<span class="dock-badge">${pending}</span>`:''}</button>`).join('')}</div></nav>`
}
function mockbar(){return `<div class="mockbar"><span>黑白结构原型 · 全部 Mock</span><button data-action="scenario">场景：${state.scenario} ▾</button></div>`}
function shell(content,active,withDock=true,bottom=''){return `<div class="phone"><div class="statusbar"><span>9:41</span><span>PhoneDSH</span></div>${mockbar()}<main class="page ${withDock?'':'no-dock'}">${content}</main>${bottom}${withDock?dock(active):''}${state.toast?`<div class="toast"><span>${esc(state.toast)}</span>${state.undo?'<button data-action="undo">撤销</button>':'<button data-action="dismiss-toast">知道了</button>'}</div>`:''}${renderSheet()}</div>`}
function button(label,action,cls='btn',value=''){return `<button class="${cls}" data-action="${action}" data-value="${esc(value)}">${label}</button>`}
function goButton(label,path,cls='btn'){return `<button class="${cls}" data-go="${path}">${label}</button>`}
function taskCard(task){
  const status={running:'执行中',waitingApproval:'等待确认',completed:'已完成',failed:'失败',cancelled:'已取消',outcomeUnknown:'结果待对账'}[task.status]||task.status;
  const path=task.id==='hardware-plan'?'task-hardware-plan':task.id==='send-feishu'?'approval-feishu':task.id==='daily-recap'?'minutes-hardware-review':'dsh';
  return `<article class="card clickable" data-go="${path}"><div class="row between top"><div><span class="badge">${status}</span><h3 style="margin-top:9px">${esc(task.title)}</h3></div><span class="micro">›</span></div><p class="small">${esc(task.source)}</p>${task.status==='running'?`<div class="progress"><span style="width:${task.progress}%"></span></div><p class="micro">第 ${task.step}/${task.total} 步 · 点击查看当前状态</p>`:''}${task.status==='waitingApproval'?`<div class="row between"><span class="small">需要本人决定后才能继续</span><span class="btn smallbtn primary">去确认</span></div>`:''}${task.status==='completed'?`<p class="small">产物与回执已保存到本地</p>`:''}${task.status==='outcomeUnknown'?`<p class="small">先对账，不自动重试</p>`:''}</article>`
}

    Object.assign(state,{dshStarted:true,agentConfigured:true,agentName:'小P',ownerName:'Leo',provider:'byok',providerConfigured:true,engine:'ready',device:{name:'小智 Link',online:true,revision:3,capabilities:['麦克风','唤醒','LED 控制']},recording:true,tasks:clone(seed.tasks),memories:clone(seed.memories),diary:true});
  }else if(name==='未配置'){
    Object.assign(state,{dshStarted:false,agentConfigured:false,providerConfigured:false,engine:'ready',device:{name:'小智 Link',online:true,revision:3,capabilities:['麦克风','唤醒','LED 控制']},recording:true,tasks:clone(seed.tasks),memories:clone(seed.memories),diary:true});
  }else if(name==='无设备'){
    Object.assign(state,{dshStarted:true,agentConfigured:true,engine:'ready',device:null,recording:false,tasks:clone(seed.tasks),memories:clone(seed.memories),diary:true});
  }else if(name==='离线'){
    Object.assign(state,{dshStarted:true,agentConfigured:true,engine:'ready',device:{name:'小智 Link',online:false,revision:3,capabilities:['麦克风','唤醒','LED 控制']},recording:false,tasks:clone(seed.tasks),memories:clone(seed.memories),diary:true});
  }else if(name==='引擎失败'){
    Object.assign(state,{dshStarted:true,agentConfigured:true,engine:'failed',device:{name:'小智 Link',online:true,revision:3,capabilities:['麦克风','唤醒','LED 控制']},recording:false,tasks:clone(seed.tasks),memories:clone(seed.memories),diary:true});
  }else if(name==='空数据'){
    Object.assign(state,{dshStarted:true,agentConfigured:true,engine:'ready',device:null,recording:false,tasks:[],memories:[],diary:false});
  }
}
function undo(){
  if(!state.undo)return;
  const u=state.undo;state.undo=null;
  if(u.type==='memory'){const m=state.memories.find(m=>m.id===u.id);if(m)m.status=u.status}
  if(u.type==='memories'){for(const m of state.memories){if(u.ids.includes(m.id))m.status='candidate'}}
  toast('已撤销上一步操作');
}
function handle(action,value,el){
  if(action==='scenario'){state.sheet='scenario';render();return}
  if(action==='close-sheet'){state.sheet=null;render();return}
  if(action==='stop-propagation'){return}
  if(action==='dismiss-toast'){state.toast=null;state.undo=null;render();return}
  if(action==='undo'){undo();return}
  if(action==='set-scenario'){applyScenario(value);render();return}
  if(action==='provider'){state.provider=value;render();return}
  if(action==='validate-key'){const key=document.getElementById('api-key')?.value.trim();if(!key){toast('请输入 Mock API key');return}state.providerConfigured=true;go('agent-name');return}
  if(action==='name-suggestion'){state.agentName=value;render();return}
  if(action==='save-agent-name'){const name=document.getElementById('agent-name')?.value.trim();if(!name){toast('先给 Agent 起个名字');return}state.agentName=name;if(state.agentConfigured){go('personal')}else{go('owner-name')}return}
  if(action==='save-owner-name'){const name=document.getElementById('owner-name')?.value.trim();if(!name){toast('请输入你的称呼');return}state.ownerName=name;state.agentConfigured=true;state.scenario='默认';toast('Personal Agent 已启用，AI日记已加入导航');go('chat');return}
  if(action==='recover-engine'){state.engine='ready';toast('本地引擎已恢复（Mock）');return}
  if(action==='suggest'){state.draft=value;render();document.getElementById('composer')?.focus();return}
  if(action==='voice'){state.draft='把刚才的讨论整理成纪要，提取待办并保存到本地';toast('已填入 Mock 听写内容');return}
  if(action==='sessions'){state.sheet='sessions';render();return}
  if(action==='dsh-more'){state.sheet='dsh-more';render();return}
  if(action==='attachments'){state.sheet='attachments';render();return}
  if(action==='use-attachment'){state.draft='分析附件中的硬件接入评审，生成纪要并提取待办';state.sheet=null;go('dsh');return}
  if(action==='file-help'){state.sheet=null;toast('正式实现将使用系统文件选择器');return}
  if(action==='start-dsh'){state.engine='ready';state.dshStarted=true;render();return}
  if(action==='send'||action==='send-dsh'){
    if(action==='send'&&!state.agentConfigured){go('agent-setup');return}
    const input=document.getElementById(action==='send'?'composer':'dsh-composer');const text=(input?.value||state.draft||'把今天的硬件接入评审整理成纪要').trim();if(!text){toast('先输入一件想完成的事');return}
    state.dshStarted=true;state.userPrompt=text;state.draft='';
    if(!state.tasks.find(t=>t.id==='hardware-plan'))state.tasks.unshift(clone(seed.tasks[0]));
    const t=state.tasks.find(t=>t.id==='hardware-plan');t.status='running';t.step=2;t.progress=66;t.title=text.length>28?text.slice(0,28)+'…':text;
    toast('已创建 Mock 任务并保存到本地');return;
  }
  if(action==='task-filter'){state.taskFilter=value;render();return}
  if(action==='advance-task'){const t=state.tasks.find(t=>t.id==='hardware-plan');t.status='completed';t.step=t.total;t.progress=100;t.artifact='硬件接入评审纪要';toast('任务已完成，产物已保存（Mock）');return}
  if(action==='unknown-task'){const t=state.tasks.find(t=>t.id==='hardware-plan');t.status='outcomeUnknown';toast('已模拟结果未知，不会自动重试');return}
  if(action==='reconcile-task'){const t=state.tasks.find(t=>t.id==='hardware-plan');t.status='completed';t.step=t.total;t.progress=100;toast('对账完成：原任务已完成（Mock）');return}
  if(action==='cancel-task'){const t=state.tasks.find(t=>t.id==='hardware-plan');t.status='cancelled';toast('已记录取消，保留检查点');return}
  if(action==='approve-send'){const t=state.tasks.find(t=>t.id==='send-feishu');t.status='completed';t.step=2;t.progress=100;state.receipt='飞书消息已发送（Mock） · 回执 F-001';render();return}
  if(action==='deny-send'){const t=state.tasks.find(t=>t.id==='send-feishu');t.status='cancelled';state.receipt='已拒绝，未执行外部动作';go('chat');return}
  if(action==='calendar'){state.sheet='calendar';render();return}
  if(action==='day-today'){state.diary=true;state.sheet=null;go('recap');return}
  if(action==='day-yesterday'){state.diary=false;state.sheet=null;go('recap');return}
  if(action==='previous-day'){state.diary=false;go('recap');return}
  if(action==='highlight-trail'){state.sheet='highlight-trail';render();return}
  if(action==='dialogue'){state.minuteTab='transcript';state.highlightEvidence=false;go('minutes-hardware-review');return}
  if(action==='minute-tab'){state.minuteTab=value;state.highlightEvidence=false;render();return}
  if(action==='evidence'){state.minuteTab='transcript';state.highlightEvidence=true;render();return}
  if(action==='quote-chat'){state.draft='请继续核对“硬件接入评审”中的待办和原话引用';go('chat');return}
  if(action==='speaker-name'){toast('说话人命名入口（Mock），命名后可回溯修订');return}
  if(action==='quote-line'){state.draft=value;go('chat');return}
  if(action==='audio-toggle'){state.audioPlaying=!state.audioPlaying;render();return}
  if(action==='audio-seek'){state.audioPosition=Math.max(0,Math.min(2536,state.audioPosition+Number(value)));render();return}
  if(action==='audio-seek-to'){state.audioPosition=Math.max(0,Math.min(2536,Number(value)));state.audioPlaying=true;render();return}
  if(action==='minutes-more'){state.sheet='minutes-more';render();return}
  if(action==='copy-minutes'){state.sheet=null;toast('已复制 Mock 纪要，不包含真实录音或个人数据');return}
  if(action==='audio-rate'){state.audioRate=state.audioRate===1?1.5:state.audioRate===1.5?2:1;render();return}
  if(action==='memory-tab'){state.memoryTab=value;render();return}
  if(action==='memory-search'){state.memoryQuery=document.getElementById('memory-search')?.value||'';render();return}
  if(action==='confirm-memory'){const m=state.memories.find(m=>m.id==='local-first');m.status='active';state.undo={type:'memory',id:m.id,status:'candidate'};toast('已确认，后续回答可以使用（Mock）',state.undo);return}
  if(action==='reject-memory'){const m=state.memories.find(m=>m.id==='local-first');m.status='rejected';state.undo={type:'memory',id:m.id,status:'candidate'};toast('候选已驳回，不用于后续回答',state.undo);return}
  if(action==='edit-memory'){state.sheet=null;state.draft='请把这条记忆改得更准确：'+state.memories.find(m=>m.id==='local-first').text;go('chat');return}
  if(action==='forget-memory'){state.sheet='forget';render();return}
  if(action==='confirm-forget'){const m=state.memories.find(m=>m.id==='local-first');m.status='forgotten';state.sheet=null;state.undo={type:'memory',id:m.id,status:'candidate'};toast('已停止用于新回答（Mock）',state.undo);return}
  if(action==='pending-service'){state.sheet='pending';render();return}
  if(action==='toggle-led'){if(!deviceReady()){toast('设备离线，不能执行控制');return}state.device.revision+=1;toast(`LED 已切换（Mock） · revision ${state.device.revision}`);return}
  if(action==='device-offline'){state.device.online=false;render();return}
  if(action==='unpair'){state.device=null;toast('已解绑（Mock），历史数据保留');return}
  if(action==='pair-select'){state.pairSelected=true;render();return}
  if(action==='pair-next'){
    if(!state.pairSelected){toast('先选择一台设备');return}
    if(state.device&&!state.device.online){state.pairStage='fail'}else state.pairStage=state.pairStage==='scan'?'confirm':'capabilities';render();return;
  }
  if(action==='pair-complete'){state.device={name:'小智 Link',online:true,revision:1,capabilities:['麦克风','唤醒','LED 控制']};state.pairStage='success';state.recording=true;render();return}
  if(action==='pair-cancel'){state.pairStage='scan';state.pairSelected=false;go('devices');return}
  if(action==='pair-fail'){state.pairStage='fail';render();return}
  if(action==='pair-retry'){state.pairStage='scan';state.pairSelected=false;if(state.device)state.device.online=true;render();return}
  if(action==='toggle-recording'){state.recording=!state.recording;toast(state.recording?'已恢复录音（Mock）':'已暂停新的音频采集');return}
  if(action==='export-data'){
    const data={mock:true,product:'PhoneDSH structure prototype',agentConfigured:state.agentConfigured,provider:state.provider,tasks:state.tasks,memories:state.memories};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pdsh-mock-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已生成 Mock 导出文件');return;
  }
  if(action==='forget-all'){state.sheet='forget-all';render();return}
  if(action==='confirm-forget-all'){const ids=state.memories.filter(m=>m.status==='candidate').map(m=>m.id);for(const m of state.memories){if(ids.includes(m.id))m.status='forgotten'}state.sheet=null;state.undo={type:'memories',ids};toast('候选已清理（Mock）',state.undo);return}
}
document.addEventListener('click',event=>{
  const path=event.target.closest('[data-go]');if(path){event.preventDefault();go(path.dataset.go);return}
  const el=event.target.closest('[data-action]');if(!el)return;event.preventDefault();event.stopPropagation();handle(el.dataset.action,el.dataset.value,el);
});
document.addEventListener('input',event=>{if(event.target.id==='composer'||event.target.id==='dsh-composer')state.draft=event.target.value;if(event.target.id==='memory-search')state.memoryQuery=event.target.value;if(event.target.id==='agent-name')state.agentName=event.target.value;if(event.target.id==='owner-name')state.ownerName=event.target.value});
window.addEventListener('hashchange',()=>{state.sheet=null;render()});
function render(){
  const r=route();
  const pages={dsh,chat,'agent-setup':agentSetup,'agent-name':agentName,'owner-name':ownerName,'task-hardware-plan':taskDetail,'approval-feishu':approval,recap,'minutes-hardware-review':minutes,discover,personal,memory,'memory-local-first':memoryDetail,devices,'pair-xiaozhi':pairing,settings,privacy,welcome:dsh,setup:agentSetup,tasks:dsh,services:discover};
  const page=pages[r]||dsh;document.getElementById('app').innerHTML=page();
}
render();
</script>
</body>
