# SPDX-License-Identifier: MIT
# Placeholder version catalog for the Android adapter tree.
# EVERY pin below is UNVERIFIED: this round has no network and no Gradle.
# Replace each value with the version resolved on the build host, then remove
# the "# unverified pin" annotation. Do not treat these numbers as tested.

[versions]
agp = "8.7.3"                       # unverified pin
kotlin = "2.1.0"                    # unverified pin
compose-bom = "2025.01.00"          # unverified pin
androidx-core = "1.15.0"            # unverified pin
androidx-activity-compose = "1.9.3" # unverified pin
junit = "4.13.2"                    # unverified pin
androidx-test-ext-junit = "1.2.1"   # unverified pin
espresso = "3.6.1"                  # unverified pin
jsch = "2.28.8"                     # unverified pin
bouncycastle = "1.86"               # unverified pin
# PC pairing QR (design §6 C5). CameraX 1.4.1 is the stable line for compileSdk 35;
# ZXing core 3.5.3 is the pure-Java decoder. Both are :app-only so the published
# :lib AAR stays camera-free.
camera = "1.4.1"                    # unverified pin
zxing = "3.5.3"                     # unverified pin

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
