# SPDX-License-Identifier: MIT
# phone-dsh phone DSH — iOS Phase 0 probe app (PLAN W3-APP).
#
# The project is generated by XcodeGen; the generated PhoneDSHProbe.xcodeproj
# is intentionally not committed. Generate with:  xcodegen generate
# Build for the simulator with:
#   xcodebuild -scheme PhoneDSHProbe -destination 'generic/platform=iOS Simulator' \
#     build CODE_SIGNING_ALLOWED=NO
#
# The app links the phone-DSH modules directly from ../.. (a local SwiftPM
# package). The Worker image and static www are copied into Bundle/worker by
# scripts/copy-bundle-assets.sh; they are not committed.
name: PhoneDSHProbe

options:
  bundleIdPrefix: local.phone-dsh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PhoneDSH:
    path: ../..

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Automatic
    # Placeholder bundle id: change it for a device-signed build. The
    # continued-processing task identifier in Config/PhoneDSHProbe-Info.plist
    # derives from it with $(PRODUCT_BUNDLE_IDENTIFIER).
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  PhoneDSHProbe:
    type: application
    platform: iOS
    sources:
      - path: PhoneDSHProbe
      # Folder reference: every file under Bundle/worker is copied into the
      # app bundle as "worker/" and served by the loopback origin.
      - path: Bundle/worker
        type: folder
        buildPhase: resources
      # Offline 3D library for the PAGE surface (three.js r170 + loaders +
      # scaffold/demo). Served as pdsh-page://lib/... from the app bundle.
      - path: Web3DLib
        type: folder
        buildPhase: resources
    dependencies:
      - target: ProbeKit
      # SwiftPM products are not re-exported: every module the app imports
      # directly is linked here.
      - package: PhoneDSH
        product: PhoneDSH
      # ChatModel constructs PhoneDSHConfiguration directly; its `log` field
      # is PhoneDSHLog.WorkspaceLogConfiguration, so the app target must link
      # that product explicitly instead of relying on a transitive test build.
      - package: PhoneDSH
        product: PhoneDSHLog
      # DeviceTier/BudgetTable drive the configuration's budget row (12 GiB
      # devices select the larger row).
      - package: PhoneDSH
        product: PhoneDSHController
      - package: PhoneDSH
        product: PhoneDSHEngine
      # the Chat page drives a harness session (HarnessEvent/HarnessCommand) and renders JSONValue arguments
      - package: PhoneDSH
        product: PhoneDSHAgentCore
      - package: PhoneDSH
        product: PhoneDSHWire
      - package: PhoneDSH
        product: PhoneDSHShell
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.phone-dsh.probe
        PRODUCT_NAME: PhoneDSHProbe
        INFOPLIST_FILE: Config/PhoneDSHProbe-Info.plist
        # The app's own Keychain items (model provider API keys) need the
        # default access group; a build without this entitlement gets
        # errSecMissingEntitlement for every keychain query.
        CODE_SIGN_ENTITLEMENTS: Config/PhoneDSHProbe.entitlements
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  ProbeKit:
    type: framework
    platform: iOS
    sources:
      - path: ProbeKit
      # Reuse the W3-PROBES page/Worker fixture from the shared harness target
      # instead of copying it: one source of truth for both harnesses. The
      # fixture is a resource of `PhoneDSHHarness` (a regular package
      # target); no source file from sdk/Tests is path-included anywhere.
      - path: ../../Sources/PhoneDSHHarness/Resources/probe-site
        type: folder
        buildPhase: resources
    dependencies:
      - package: PhoneDSH
        product: PhoneDSH
      - package: PhoneDSH
        product: PhoneDSHEngine
      - package: PhoneDSH
        product: PhoneDSHLoopback
      - package: PhoneDSH
        product: PhoneDSHLog
      - package: PhoneDSH
        product: PhoneDSHWire
      - package: PhoneDSH
        product: PhoneDSHAgentCore
      - package: PhoneDSH
        product: PhoneDSHController
      # WebHostConfiguration assembles the linked PDSHShellProvider and its
      # runnable accelerator set for the production Web surface and the E2E.
      - package: PhoneDSH
        product: PhoneDSHShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.phone-dsh.probe.probekit
        PRODUCT_NAME: ProbeKit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"

  # W13-SIM-SCENARIOS: the G2 catalog-driven scenario runner on the iOS
  # Simulator. Hostless like PhoneDSHSimTests; the engine lives in the regular
  # SwiftPM target `PhoneDSHScenario`. `scripts/ci/scenarios.sh
  # --run-on sim` installs the probe app, stages the catalog/fixtures/config in
  # its Documents/pdsh-scenarios container, passes model credentials only through
  # the TEST_RUNNER_ environment, and pulls results back with simctl.
  PhoneDSHScenarioSimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhoneDSHScenarioSimTests
    dependencies:
      - package: PhoneDSH
        product: PhoneDSHScenario
      - package: PhoneDSH
        product: PhoneDSH
      - package: PhoneDSH
        product: PhoneDSHHarness
      - package: PhoneDSH
        product: PhoneDSHEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.phone-dsh.probe.scenariosimtests
        PRODUCT_NAME: PhoneDSHScenarioSimTests
        INFOPLIST_FILE: Config/PhoneDSHScenarioSimTests-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"

  # W3-SIM: hostless XCTest target. No TEST_HOST: `xcodebuild test` launches
  # the XCTest runner directly, so the suite can run headless on the
  # simulator. `scripts/ci/sim.sh` installs the probe app first; the
  # tests find its bundled Worker assets and write reports into the app
  # container's Documents/pdsh-reports (the script pulls them with
  # `simctl get_app_container`). The test target deliberately does not carry
  # its own copy of Bundle/worker: the installed app bundle is the single set
  # of Worker assets the suites use, so they exercise the production layout.
  PhoneDSHSimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhoneDSHSimTests
      # The production native MCP settings model is host-agnostic (the app
      # injects ChatModel) so the simulator suite can exercise the
      # unknown-registry settlement branches against a real settings document.
      - path: PhoneDSHProbe/MCPSettingsModel.swift
      # The native Daily Brief presentation model is UI-free and lets the suite
      # exercise add → refresh → persist → offline reload against ProbeKit.
      - path: PhoneDSHProbe/DailyBriefModel.swift
      # The scripted model upstream, the smoke evidence readers (WAL
      # replay/journal/step formats) and the kill-matrix support ship as the
      # regular SwiftPM target `PhoneDSHHarness`; this target links its
      # `.library` product instead of path-including files from sdk/Tests. No
      # test target may depend on another test target: Xcode's package
      # resolver rejects that edge.
    dependencies:
      - target: ProbeKit
      - package: PhoneDSH
        product: PhoneDSHHarness
      - package: PhoneDSH
        product: PhoneDSH
      - package: PhoneDSH
        product: PhoneDSHEngine
      - package: PhoneDSH
        product: PhoneDSHController
      - package: PhoneDSH
        product: PhoneDSHLog
      - package: PhoneDSH
        product: PhoneDSHWire
      - package: PhoneDSH
        product: PhoneDSHLoopback
      - package: PhoneDSH
        product: PhoneDSHAgentCore
      # The simulator suites import the linked shell provider exposed by the
      # shared WebHostConfiguration assembly.
      - package: PhoneDSH
        product: PhoneDSHShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.phone-dsh.probe.simtests
        PRODUCT_NAME: PhoneDSHSimTests
        INFOPLIST_FILE: Config/PhoneDSHSimTests-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"

  # Device twin of PhoneDSHScenarioSimTests: the same sources hosted by the
  # probe app, because tool-hosted unit tests cannot run on a physical device.
  # `scripts/ci/scenarios.sh --run-on sim --destination 'platform=iOS,id=…'`
  # uses the PhoneDSHScenarioDevice scheme; the simulator flow is unchanged.
  PhoneDSHScenarioDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhoneDSHScenarioSimTests
    dependencies:
      - target: PhoneDSHProbe
      - package: PhoneDSH
        product: PhoneDSHScenario
      - package: PhoneDSH
        product: PhoneDSH
      - package: PhoneDSH
        product: PhoneDSHHarness
      - package: PhoneDSH
        product: PhoneDSHEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.phone-dsh.probe.scenariodevicetests
        PRODUCT_NAME: PhoneDSHScenarioDeviceTests
        INFOPLIST_FILE: Config/PhoneDSHScenarioSimTests-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"

  # Device twin of PhoneDSHSimTests (probe / smoke / kill matrix / Web surface hosted by the app).
  PhoneDSHDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhoneDSHSimTests
      # Keep the device twin at parity with PhoneDSHSimTests: the shared
      # native MCP settings model has no SwiftUI/UIKit dependency and is also
      # part of the app target. Without this the device test scheme does not
      # compile.
      - path: PhoneDSHProbe/MCPSettingsModel.swift
      - path: PhoneDSHProbe/DailyBriefModel.swift
    dependencies:
      - target: PhoneDSHProbe
      - target: ProbeKit
      - package: PhoneDSH
        product: PhoneDSHHarness
      - package: PhoneDSH
        product: PhoneDSH
      - package: PhoneDSH
        product: PhoneDSHEngine
      - package: PhoneDSH
        product: PhoneDSHController
      - package: PhoneDSH
        product: PhoneDSHLog
      - package: PhoneDSH
        product: PhoneDSHWire
      - package: PhoneDSH
        product: PhoneDSHLoopback
      - package: PhoneDSH
        product: PhoneDSHAgentCore
      - package: PhoneDSH
        product: PhoneDSHShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.phone-dsh.probe.devicetests
        PRODUCT_NAME: PhoneDSHDeviceTests
        INFOPLIST_FILE: Config/PhoneDSHSimTests-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"

  PhoneDSHDeviceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhoneDSHDeviceUITests
    dependencies:
      - target: PhoneDSHProbe
      - package: PhoneDSH
        product: PhoneDSHHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.phone-dsh.probe.deviceuitests
        PRODUCT_NAME: PhoneDSHDeviceUITests
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: PhoneDSHProbe
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"

schemes:
  PhoneDSHProbe:
    build:
      targets:
        PhoneDSHProbe: all
        ProbeKit: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # W13-SIM-SCENARIOS: same probe app but the scenario suite. Builds the app
  # (its Bundle/worker resources are what the scenarios load) and runs the
  # hostless PhoneDSHScenarioSimTests bundle. `scenarios.sh --run-on sim` calls
  # `xcodebuild test -scheme PhoneDSHScenarioSim`.
  PhoneDSHScenarioSim:
    build:
      targets:
        PhoneDSHProbe: all
        ProbeKit: all
        PhoneDSHScenarioSimTests: [test]
    test:
      config: Debug
      targets:
        - PhoneDSHScenarioSimTests
    run:
      config: Debug
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  # W3-SIM simulator gate: builds the probe app (its Bundle/worker resources
  # are what the tests load) and runs the hostless PhoneDSHSimTests suite.
  # scripts/ci/sim.sh calls `xcodebuild test -scheme PhoneDSHSim`.
  PhoneDSHSim:
    build:
      targets:
        PhoneDSHProbe: all
        ProbeKit: all
        PhoneDSHSimTests: [test]
    test:
      config: Debug
      targets:
        - PhoneDSHSimTests
    run:
      config: Debug
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  # Physical-device twins: the suites run hosted in the probe app.
  PhoneDSHScenarioDevice:
    build:
      targets:
        PhoneDSHProbe: all
        ProbeKit: all
        PhoneDSHScenarioDeviceTests: [test]
    test:
      config: Debug
      targets:
        - PhoneDSHScenarioDeviceTests
    run:
      config: Debug
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  PhoneDSHDevice:
    build:
      targets:
        PhoneDSHProbe: all
        ProbeKit: all
        PhoneDSHDeviceTests: [test]
    test:
      config: Debug
      targets:
        - PhoneDSHDeviceTests
    run:
      config: Debug
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  PhoneDSHDeviceUI:
    build:
      targets:
        PhoneDSHProbe: all
        ProbeKit: all
        PhoneDSHDeviceUITests: [test]
    test:
      config: Debug
      targets:
        - PhoneDSHDeviceUITests
    run:
      config: Debug
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug
