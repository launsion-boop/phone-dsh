<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="pdsh-csp" content="local">
<title>旋转立方体 · 3D 示例</title>
<style>
  html, body { margin: 0; height: 100%; background: #f2f2f4; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #hint { position: fixed; left: 12px; bottom: 12px; font: 12px/1.4 -apple-system, ui-sans-serif;
          color: #6b7280; background: rgba(255,255,255,.82); padding: 4px 8px; border-radius: 6px; }
</style>
<script type="importmap">
{ "imports": { "three": "pdsh-page://lib/three.module.min.js" } }
</script>
</head>
<body>
<div id="hint">拖动旋转 · 双指缩放</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'pdsh-page://lib/loaders/GLTFLoader.js';
import { OrbitControls } from 'pdsh-page://lib/controls/OrbitControls.js';
import { RoomEnvironment } from 'pdsh-page://lib/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.domElement.style.touchAction = 'none';
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2f2f4);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.8, 2.0, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

let cube = null;
new GLTFLoader().load('cube.glb', (gltf) => {
  cube = gltf.scene;
  scene.add(cube);
  // Keep the first frame honest: report the loaded model so a failed asset
  // is visible instead of a silent empty stage.
  document.getElementById('hint').textContent =
    '已加载 cube.glb（' + gltf.scene.children.length + ' 个节点）· 拖动旋转';
}, undefined, (error) => {
  document.getElementById('hint').textContent =
    'cube.glb 加载失败：' + (error && error.message ? error.message : error);
});

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (cube) {
    cube.rotation.y += dt * 0.6;   // 约 10.5 秒一圈
    cube.rotation.x += dt * 0.2;
  }
  controls.update();
  renderer.render(scene, camera);
});
window.addEventListener('pagehide', () => {
  renderer.setAnimationLoop(null);
  renderer.dispose();
});
</script>
</body>
</html>
