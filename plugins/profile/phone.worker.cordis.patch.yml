# ── phone-dsh plugins ─────────────────────────────────────────────────────
- insert:
    - id: subprocess-xl
      name: '@phone-dsh/dsh-subprocess-xl'

    # The Worker shell is the boundary: commands never leave it unconfined
    # except the read-only accelerators routed by the ordered channel.
    - id: sandbox-xl
      name: '@phone-dsh/dsh-subprocess-xl/sandbox'

    # JSONL persistence plus tool-journal reconciliation on write-open, in
    # plaintext (`compression: none`). DSH 0.2.1's session-persistence-jsonl is
    # a function plugin whose service class is private, so the 0.1.7 subclass
    # wrapper cannot mount; this adapter wraps the service's write-open instead.
    - id: session-persistence-journaled
      name: '@phone-dsh/dsh-surface-phone'
      config:
        mode: session-persistence
        root: !!js dshHomePath('sessions')
        compression: none

    # exec-bridge prefers the ordered channel published on
    # globalThis.__PDSH_CHANNEL__ (PDSH_CHANNEL_URL / PDSH_CHANNEL_TOKEN); the
    # PDSH_EXEC_BRIDGE_URL below is the desktop-only fallback, for simulations
    # where no channel exists.
    - id: pdsh-exec-bridge
      name: '@phone-dsh/dsh-exec-bridge'
      config:
        url: !!js process.env.PDSH_EXEC_BRIDGE_URL

    - id: llm-bridge
      name: '@phone-dsh/dsh-llm-bridge'
      config:
        mode: auto
        hostProxy: !!js "['1', 'all'].includes(process.env.PDSH_LLM_VIA_HOST ?? '')"
        hostProxyRoutes: !!js "process.env.PDSH_LLM_VIA_HOST === 'all' ? 'all' : 'external'"

    - id: tool-journal
      name: '@phone-dsh/dsh-tool-journal'
      config:
        root: !!js dshHomePath('tool-journal')
        profile: !!js "`pdsh-phone/1+dsh-${process.env.PDSH_DSH_VERSION ?? 'unknown'}`"

    - id: lifecycle-gate
      name: '@phone-dsh/dsh-lifecycle-gate'
      config:
        bridge: true
        file: !!js process.env.PDSH_LIFECYCLE_FILE

    # The App's own MCP server (phone tools) on loopback, streamable HTTP.
    - id: mcp-phone
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!process.env.PDSH_PHONE_MCP_URL"
      config:
        serverName: phone
        transport: streamable-http
        url: !!js "process.env.PDSH_PHONE_MCP_URL ?? 'http://127.0.0.1:1/mcp'"
        headers:
          Authorization: !!js "`Bearer ${process.env.PDSH_PHONE_MCP_TOKEN ?? ''}`"
        failOnStartupError: false

    # ── phone public surfaces over the same Worker/session/VFS ──────────────
    # Read-only projection of the native model service, plus the real action
    # that opens the native configuration sheet from the Web settings tab.
    - id: phone-model-config
      name: '@phone-dsh/dsh-phone-model-config'

    # Installed-plugin enablement, flat user skills and the official preset
    # roster. The Host writes only the profile layer; the image is immutable.
    - id: feature-admin
      name: '@phone-dsh/dsh-feature-admin'

    # Official roster the feature-admin tab lists/selects. The preset
    # declarations are applied from the pinned Web-app bundle by the packer.
    # `standard` is the default again: the Worker serves its
    # `workflow-ptc`/`tool-workflow` rows with the native bridge in
    # `workflow-worker` (official meta/workflow semantics in a dedicated
    # workflow Worker; the official process PTC runtime is still absent).
    # `ptc` is usable because its presentation row falls back to real native
    # presentation when no `ptcRuntime` exists; it does not claim PTC
    # execution is available. `minimal` and `cordis` stay listed and report
    # their real broken rows (terminals/PTY, cordisInspect): they are not
    # hidden or replaced by a healthy-looking stub. `phone` remains only as a
    # non-default compatibility preset for sessions created before the
    # standard preset worked on the Worker; it lacks `workflow-ptc`/
    # `tool-workflow`, has no `tool-pwsh` row and no independent Search/Fetch
    # provider pair, so its `web_fetch` stays off.
    #
    # The Worker still deliberately does not mount desktop host services
    # (PTC process runtime, PTY, xdg), so PTC/PTY/full capability remain
    # NOT PASS until the official preset is validated on Mac. This is the
    # `phone-dsh-standard-preset-1027` replacement tracked in
    # integration-blockers.json; the other shipped presets remain listed
    # (and report their real broken rows).
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    # Legacy compatibility only. This is NOT the final default: it exists so
    # a session that already recorded `phone` can still re-open and recompose.
    # New sessions use the official standard preset.
    - id: preset-phone
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: phone
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              # Both registration sites use the same conditional contract:
              # no web_search for empty/unsupported provider ids, and web_fetch
              # only with the independent Search/Fetch provider pair.
              search: !!js (process.env.PDSH_WEB_SEARCH_PROVIDER ?? process.env.DSH_WEB_SEARCH_PROVIDER) === 'deepseek-official' || (process.env.PDSH_WEB_SEARCH_PROVIDER ?? process.env.DSH_WEB_SEARCH_PROVIDER) === 'deepseek-search-api'
              fetch: !!js (process.env.PDSH_WEB_SEARCH_PROVIDER ?? process.env.DSH_WEB_SEARCH_PROVIDER) === 'deepseek-search-api' && (process.env.PDSH_WEB_FETCH_PROVIDER ?? process.env.DSH_WEB_FETCH_PROVIDER) === 'deepseek-fetch-api'
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

    # HTTP-SSE MCP management through the official dsh-mcp-client.
    - id: phone-mcp
      name: '@phone-dsh/dsh-phone-mcp'

    # Real command console: Worker bash over the VFS and only the accelerators
    # the host advertised; it never allocates a PTY.
    - id: phone-shell
      name: '@phone-dsh/dsh-phone-shell'

    # Office documents open in the system Quick Look through the native
    # handler; the host half only holds the Loader row.
    - id: phone-native-preview
      name: '@phone-dsh/dsh-phone-native-preview'

    # Native Files folder import into the existing session workspace.
    - id: phone-directory-import
      name: '@phone-dsh/dsh-phone-directory-import'
