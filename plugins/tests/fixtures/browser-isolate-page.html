<!--
  Real-browser companion to `tests/browser-isolate.test.ts`.

  The page creates the production `workflow-isolate.js` as a module Worker,
  answers the child bridge with a fixed child result (the model/tool loop is
  not under test here), then runs a second and third Worker to prove a sync
  loop is stopped by the realm and the next workflow still completes.
-->
<meta charset="utf-8">
<title>pending</title>
<body>pending</body>
<script type="module">
const runWorkflow = (body, timeoutMs) => new Promise((resolve) => {
  const log = []
  const worker = new Worker('/workflow-isolate.js', { type: 'module' })
  worker.onmessage = (event) => {
    const message = event.data
    log.push(message.type)
    if (message.type === 'child-start') {
      worker.postMessage({ type: 'child-started', callId: message.callId, childId: 'browser-child-1' })
    } else if (message.type === 'child-result') {
      worker.postMessage({
        type: 'child-result-ok',
        callId: message.callId,
        result: { output: [{ type: 'text', text: 'BROWSER_CHILD_OK' }], stopReason: 'completed' },
      })
    } else if (message.type === 'child-dispose') {
      worker.postMessage({ type: 'child-disposed', callId: message.callId })
    } else if (message.type === 'done') {
      worker.terminate()
      resolve({ done: message.result, log })
    } else if (message.type === 'fatal') {
      worker.terminate()
      resolve({ fatal: message.error, log })
    }
  }
  worker.onerror = (event) => {
    worker.terminate()
    resolve({ workerError: String(event.message ?? event), log })
  }
  worker.postMessage({
    type: 'run',
    meta: { name: 'browser-isolate', description: 'real browser Worker check' },
    body,
    limits: { maxConcurrentAgents: 1, maxTotalAgents: 4, maxItemsPerCall: 8, syncTimeoutMs: timeoutMs },
  })
})

const escapeFields = `fetchType: typeof fetch,
  processType: typeof process,
  eventSourceType: typeof EventSource,
  webTransportType: typeof WebTransport,
  workerType: typeof Worker,
  importBlocked: await (async () => {
    try { await ({}).constructor.constructor('return import("node:fs")')(); return 'reached' } catch { return 'blocked' }
  })(),
  hostSentinel: typeof ({}).constructor.constructor('return globalThis')().__PDSH_PARENT_SENTINEL__`

const normal = await runWorkflow(
  `const child = await agent('browser child'); return { child, ${escapeFields} }`,
  5000,
)
const loop = await runWorkflow('while (true) {}', 600)
const after = await runWorkflow('return "AFTER_LOOP"', 5000)
window.__RESULT__ = { normal, loop, after }
document.title = 'done'
</script>
