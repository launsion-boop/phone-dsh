# SPDX-License-Identifier: MIT
name: BotE2E
options:
  bundleIdPrefix: dev.phone-dsh.bot-e2e
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  PhoneDSH:
    path: ../../../..
targets:
  BotE2EApp:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Sources
      - path: ../../../../examples/probe-app/Bundle/worker
        type: folder
        buildPhase: resources
    dependencies:
      - package: PhoneDSH
        product: PhoneDSHBot
      - package: PhoneDSH
        product: PhoneDSH
      - package: PhoneDSH
        product: PhoneDSHEngine
      - package: PhoneDSH
        product: PhoneDSHHarness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.phone-dsh.bot-e2e.app
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  BotE2ETests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Tests
      - path: Sources/BotTurnProcessShim.swift
      - path: ../../../../Tests/PhoneDSHBotTests/MCP/BotConversationE2ETests.swift
      - path: ../../../../Tests/PhoneDSHBotTests/MCP/BotDSHRemoteRuntimeTests.swift
      - path: ../../../../Tests/PhoneDSHBotTests/MCP/BotRemoteTestSupport.swift
      - path: ../../../../Tests/PhoneDSHBotTests/MCP/BotMCPTestSupport.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotUIFormat.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotRebindDiagnostics.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotProductionServices.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotRuntimeComposition.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotMCPListenerSupervisor.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotRuntimeUnit.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotRuntimeState.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotProfileStorage.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotRosterModel.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotAppWiringLogic.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotRuntimeEffects.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotRuntimePresentation.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/Fish/BotFishMotionProfile.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotActivityPhrases.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/BotSessionRegistry.swift
      # The App and this E2E build the same production host assembly.
      - path: ../../../../examples/probe-app/ProbeKit/ChatHostConfiguration.swift
    dependencies:
      - target: BotE2EApp
      - package: PhoneDSH
        product: PhoneDSHBot
      - package: PhoneDSH
        product: PhoneDSH
      - package: PhoneDSH
        product: PhoneDSHEngine
      - package: PhoneDSH
        product: PhoneDSHHarness
      - package: PhoneDSH
        product: PhoneDSHAgentCore
      - package: PhoneDSH
        product: PhoneDSHController
      - package: PhoneDSH
        product: PhoneDSHLoopback
      - package: PhoneDSH
        product: PhoneDSHADB
      - package: PhoneDSH
        product: PhoneDSHDeviceTasks
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.phone-dsh.bot-e2e.tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  BotChatModelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: TestsChatModel/BotChatModelTests.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotChatModel.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotUIModels.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.phone-dsh.bot-e2e.chat-model-tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  # The original BotChatModelTests target never compiled (BotChatModel pulls
  # the page layer, which is not part of this bundle). The activity-line tests
  # only need the presentation projection and the phrase/timing table, so they
  # get their own target instead of widening that bundle.
  BotActivityLineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: TestsChatModel/BotActivityLineTests.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotRuntimePresentation.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/BotActivityPhrases.swift
      - path: ../../../../examples/probe-app/PhoneDSHProbe/Bot/Fish/BotFishMotionProfile.swift
    dependencies:
      - package: PhoneDSH
        product: PhoneDSHBot
      - package: PhoneDSH
        product: PhoneDSHAgentCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.phone-dsh.bot-e2e.activity-line-tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
schemes:
  BotE2EApp:
    build:
      targets:
        BotE2EApp: all
        BotE2ETests: all
        BotActivityLineTests: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BotE2ETests
        - BotActivityLineTests
