# SPDX-License-Identifier: MIT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phone-dsh-website
  namespace: tonoai
  labels:
    app.kubernetes.io/name: phone-dsh-website
    app.kubernetes.io/part-of: phone-dsh
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: phone-dsh-website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phone-dsh-website
        app.kubernetes.io/part-of: phone-dsh
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          image: tono-registry.cn-shenzhen.cr.aliyuncs.com/tonolive/phone-dsh-website@sha256:bec884570ee43e7f3da83187927e9eab3bef70da13beece2ef6f192c3d7bfb94
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: phone-dsh-website
  namespace: tonoai
spec:
  selector:
    app.kubernetes.io/name: phone-dsh-website
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phone-dsh-website
  namespace: tonoai
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "true"
    alb.ingress.kubernetes.io/healthcheck-enabled: "true"
    alb.ingress.kubernetes.io/healthcheck-method: GET
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - phonedsh.tonoai.cn
      secretName: tonoai-wildcard-tls
  rules:
    - host: phonedsh.tonoai.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phone-dsh-website
                port:
                  number: 80
